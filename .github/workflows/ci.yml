name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install pytest
      - run: test -f content/projects.ts
      - run: python3 scripts/audit_portfolio.py --portal-root . --no-write --allow-missing-siblings
      - run: make test
      - run: make code-health-r5-s1
      - run: test -f docs/uml/README.md
      - run: test -f docs/phd/START_HERE_SUPERVISOR.md
