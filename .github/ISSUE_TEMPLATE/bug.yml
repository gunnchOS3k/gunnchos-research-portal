name: Bug report
description: Something is broken or incorrect in the ecosystem
title: "[bug] "
labels: ["feedback:bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve gunnchOS. **Do not** include secrets, tokens, or private data.
        Security issues → use [private security advisories](https://github.com/gunnchOS3k/gunnchos-research-portal/security/advisories/new).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Portal / front door
        - Device OS / Capsule
        - WAIKE Learning Platform
        - gunnchAI
        - Hardware (digital engineering)
        - Research systems
        - Games / experiences
        - Other / unsure
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / SHA / device
      placeholder: "v1.0.0-rc.1 / Pixel / browser"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include secrets, PII, or proprietary competition data
          required: true