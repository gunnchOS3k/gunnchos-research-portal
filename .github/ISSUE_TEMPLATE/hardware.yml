name: Hardware (digital engineering) feedback
description: Feedback on digital hardware engineering artifacts (not fab/EVT claims)
title: "[hardware] "
labels: ["feedback:hardware", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        RC1 hardware is a **Digital Engineering Release**. Do not treat feedback as fab/EVT/DVT/PVT/certification readiness.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Device Quartet overview, Industrial design, Electronics / BOM digital, Manufacturing docs, Claim boundary / honesty, Other]
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Feedback
    validations:
      required: true
